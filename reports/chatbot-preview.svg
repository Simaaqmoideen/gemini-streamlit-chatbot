<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">Gemini Streamlit Chatbot preview</title>
  <desc id="desc">Illustration of a dark chat interface with conversation controls, a sample user question, and a streamed assistant reply.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#10131f"/>
      <stop offset="1" stop-color="#171a2a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#4f8cff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#050712" flood-opacity=".35"/>
    </filter>
  </defs>
  <rect width="1200" height="680" rx="30" fill="url(#bg)"/>
  <circle cx="1045" cy="100" r="190" fill="#7454e8" opacity=".09"/>
  <circle cx="130" cy="600" r="210" fill="#3883ef" opacity=".08"/>
  <g font-family="Inter, Segoe UI, Arial, sans-serif">
    <text x="62" y="73" fill="#b8c0d4" font-size="16" font-weight="700" letter-spacing="2.2">GEMINI · STREAMLIT</text>
    <text x="62" y="128" fill="#f6f7fb" font-size="38" font-weight="750">A chat space for curious minds.</text>
    <text x="62" y="163" fill="#a7aec2" font-size="17">A lightweight AI assistant with streamed replies and adjustable settings.</text>
    <g filter="url(#shadow)">
      <rect x="62" y="202" width="1076" height="420" rx="22" fill="#1d2130" stroke="#32384d"/>
      <path d="M84 202h225v420H84a22 22 0 0 1-22-22V224a22 22 0 0 1 22-22Z" fill="#171a27"/>
      <path d="M309 202v420" stroke="#32384d"/>
    </g>
    <g>
      <rect x="91" y="231" width="34" height="34" rx="11" fill="url(#accent)"/>
      <path d="M101 248c0-5 3.7-9 8-9s8 4 8 9-3.7 8-8 8-8-3-8-8Zm4-1 3 2 5-5" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="138" y="254" fill="#f3f4fa" font-size="15" font-weight="650">Gemini Chat</text>
      <text x="91" y="306" fill="#828ba3" font-size="11" font-weight="700" letter-spacing="1.5">CONVERSATION</text>
      <rect x="84" y="324" width="202" height="42" rx="10" fill="#292d40"/>
      <circle cx="105" cy="345" r="5" fill="#9a7bff"/>
      <text x="120" y="350" fill="#e6e8f1" font-size="13">New conversation</text>
      <text x="91" y="410" fill="#828ba3" font-size="11" font-weight="700" letter-spacing="1.5">PERSONALIZE</text>
      <text x="91" y="444" fill="#c4c9d8" font-size="13">System prompt</text>
      <rect x="91" y="456" width="194" height="7" rx="3.5" fill="#3b4054"/>
      <rect x="91" y="456" width="114" height="7" rx="3.5" fill="#8b73f5"/>
      <text x="91" y="496" fill="#c4c9d8" font-size="13">Reply length</text>
      <rect x="91" y="508" width="194" height="7" rx="3.5" fill="#3b4054"/>
      <circle cx="221" cy="511.5" r="8" fill="#a997ff" stroke="#171a27" stroke-width="3"/>
      <text x="91" y="548" fill="#c4c9d8" font-size="13">Temperature</text>
      <rect x="91" y="560" width="194" height="7" rx="3.5" fill="#3b4054"/>
      <circle cx="164" cy="563.5" r="8" fill="#a997ff" stroke="#171a27" stroke-width="3"/>
    </g>
    <g>
      <text x="346" y="244" fill="#f4f5fa" font-size="16" font-weight="650">AI Chatbot</text>
      <text x="346" y="272" fill="#9099b0" font-size="13">Ask a question and explore the answer together.</text>
      <rect x="346" y="304" width="744" height="74" rx="15" fill="#2a2e40"/>
      <circle cx="375" cy="341" r="15" fill="#4c8dff"/>
      <text x="375" y="346" fill="#fff" font-size="13" font-weight="700" text-anchor="middle">Y</text>
      <text x="403" y="337" fill="#f1f2f8" font-size="14">Explain machine learning in one sentence.</text>
      <text x="403" y="357" fill="#8e97ad" font-size="12">You</text>
      <circle cx="375" cy="422" r="15" fill="url(#accent)"/>
      <path d="M368 422h14m-7-7v14" stroke="#fff" stroke-width="2" stroke-linecap="round"/>
      <text x="403" y="416" fill="#e9ebf4" font-size="14">Machine learning helps computers find patterns in examples</text>
      <text x="403" y="437" fill="#e9ebf4" font-size="14">so they can make useful predictions.</text>
      <text x="403" y="460" fill="#8e97ad" font-size="12">Gemini · streamed response</text>
      <rect x="346" y="526" width="744" height="58" rx="14" fill="#292d3d" stroke="#41475c"/>
      <text x="370" y="561" fill="#939bb0" font-size="14">Message Gemini...</text>
      <rect x="1035" y="536" width="40" height="38" rx="11" fill="url(#accent)"/>
      <path d="M1055 562v-15m0 0-6 6m6-6 6 6" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="346" y="604" fill="#737c93" font-size="11">Illustrative preview · generated sample text</text>
    </g>
  </g>
</svg>
